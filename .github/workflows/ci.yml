name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            arch: x64
          - name: linux-x64
            os: ubuntu-24.04
            arch: x64
          - name: macos-arm64
            os: macos-15
            arch: arm64
          - name: macos-x64
            os: macos-15-intel
            arch: x64
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Prepare Mac test temporary directory
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/aelion-tests"
          echo "TMPDIR=$RUNNER_TEMP/aelion-tests" >> "$GITHUB_ENV"
      - name: Install dependencies
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile --reporter=append-only
      - name: Set up native test Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
      - name: Install native test Python dependencies
        run: python -m pip install --disable-pip-version-check --no-input python-pptx openpyxl
      - name: Audit source
        if: runner.os == 'Linux'
        run: pnpm run audit:publish
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        timeout-minutes: ${{ runner.os == 'Windows' && 15 || 8 }}
        env:
          AELION_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: pnpm test
      - name: Test bundled skill helpers
        run: python -m unittest discover -s tests -p bundled_skill_helpers_test.py -v
      - name: Build desktop
        run: pnpm run build
      - name: Test website
        if: runner.os == 'Linux'
        run: pnpm run site:test
      - name: Test website deployment and rollback
        if: runner.os == 'Linux'
        run: python -m unittest discover -s website/deploy/tests -p 'test_*.py' -v
      - name: Build website
        if: runner.os == 'Linux'
        run: pnpm run site:build
