name: Publish verified release
run-name: Publish verified build ${{ inputs.build_run_id }}
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Desktop release build containing all three platforms and Mac VM checks
        type: string
        required: true
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-aelion-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify completed build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          node <<'NODE'
          const {execFileSync}=require('node:child_process'),{appendFileSync}=require('node:fs');
          const id=process.env.BUILD_RUN_ID,repo=process.env.GITHUB_REPOSITORY;
          if(!/^\d+$/.test(id))throw Error('Invalid build run ID');
          const api=path=>JSON.parse(execFileSync('gh',['api',`repos/${repo}/${path}`],{encoding:'utf8'}));
          const run=api(`actions/runs/${id}`);
          if(run.status!=='completed'||run.conclusion!=='success'||run.path!=='.github/workflows/release.yml'||!['push','workflow_dispatch'].includes(run.event)||run.head_repository.full_name!==repo||! /^[a-f0-9]{40}$/.test(run.head_sha))throw Error('A completed, successful release build from this repository is required');
          const jobs=api(`actions/runs/${id}/jobs?per_page=100`).jobs;
          for(const name of ['windows-x64','macos-arm64','macos-x64']){
            const job=jobs.find(j=>j.name===name);
            const checks=['Audit source','Typecheck','Test',...(name==='windows-x64'?['Build and verify Windows installer']:['Build and verify Mac installers','Verify packaged Mac app','Verify Mac Linux desktop and persistence'])];
            if(job?.conclusion!=='success'||checks.some(name=>!job.steps.some(s=>s.name===name&&s.conclusion==='success')))throw Error('Required checks did not pass: '+name);
          }
          const artifacts=api(`actions/runs/${id}/artifacts?per_page=100`).artifacts;
          for(const name of ['AelionBot-windows-x64','AelionBot-macos-arm64','AelionBot-macos-x64'])if(!artifacts.some(a=>a.name===name&&!a.expired&&a.size_in_bytes>0))throw Error('Verified build artifact missing: '+name);
          appendFileSync(process.env.GITHUB_OUTPUT,`sha=${run.head_sha}\nrun_id=${id}\n`);
          console.log(`Using verified build ${id}, source ${run.head_sha}`);
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: AelionBot-*
          path: release/downloaded
          merge-multiple: true
      - name: Tag verified source and publish complete assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFIED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node <<'NODE'
          const {execFileSync,spawnSync}=require('node:child_process'),{readFileSync}=require('node:fs');
          const repo=process.env.GH_REPO,sha=process.env.VERIFIED_SHA,version=JSON.parse(readFileSync('package.json','utf8')).version,tag=`v${version}`;
          if(!/^\d+\.\d+\.\d+$/.test(version)||execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==sha)throw Error('Verified source mismatch');
          const ref=spawnSync('gh',['api',`repos/${repo}/git/ref/tags/${tag}`],{encoding:'utf8'});
          if(ref.status!==0){
            if(!ref.stderr.includes('HTTP 404'))throw Error(ref.stderr);
            execFileSync('gh',['api','--method','POST',`repos/${repo}/git/refs`,'--input','-'],{input:JSON.stringify({ref:`refs/tags/${tag}`,sha}),stdio:['pipe','inherit','inherit']});
          }
          execFileSync('git',['fetch','--no-tags','origin',`refs/tags/${tag}:refs/tags/${tag}`],{stdio:'inherit'});
          if(execFileSync('git',['rev-parse',`${tag}^{commit}`],{encoding:'utf8'}).trim()!==sha)throw Error('Existing version tag points to a different commit');
          const result=spawnSync(process.execPath,['scripts/publish-release.mjs','release/downloaded'],{env:{...process.env,GITHUB_REF_TYPE:'tag',GITHUB_REF_NAME:tag},stdio:'inherit'});
          if(result.status!==0)process.exit(result.status||1);
          NODE
