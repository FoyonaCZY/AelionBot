name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        options: [all, windows]
        default: all
      vm_smoke:
        description: Run the Mac guest desktop smoke test (requires HVF; hosted GitHub Mac runners use TCG and will fail fast)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  guest-installer:
    name: Debian installer check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify signed package installation and source fallback
        run: |
          docker run --rm -v "$PWD:/src:ro" debian:bookworm-slim sh -ec 'apt-get -o Acquire::Retries=2 update && apt-get install -y --no-install-recommends python3 ca-certificates && python3 /src/scripts/verify-package-installer.py'
  build:
    needs: guest-installer
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'windows' && '[{"name":"windows-x64","os":"windows-latest","arch":"x64"}]' || '[{"name":"windows-x64","os":"windows-latest","arch":"x64"},{"name":"macos-arm64","os":"macos-15","arch":"arm64"},{"name":"macos-x64","os":"macos-15-intel","arch":"x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.vm_smoke && 75 || 30 }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Prepare Mac test temporary directory
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/aelion-tests"
          echo "TMPDIR=$RUNNER_TEMP/aelion-tests" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Audit source
        run: npm run audit:publish
      - name: Typecheck
        run: npm run typecheck
      - name: Set up native test Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
      - name: Test
        timeout-minutes: 5
        env:
          AELION_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm test
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: runtime
        with:
          path: |
            runtime/qemu
            runtime/downloads
          key: qemu-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/prepare-runtime.mjs', 'scripts/prepare-macos-runtime.mjs', 'scripts/runtime-archiver.mjs') }}
      - name: Install Mac build runtime
        if: ${{ runner.os == 'macOS' && steps.runtime.outputs.cache-hit != 'true' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install qemu
      - name: Prepare bundled runtime
        if: ${{ steps.runtime.outputs.cache-hit != 'true' }}
        run: npm run vm:prepare-runtime
      - name: Verify bundled runtime
        run: node scripts/verify-bundled-runtime.mjs
      - name: Build and verify Windows installer
        if: runner.os == 'Windows'
        run: npm run package:release
      - name: Build and verify Mac installers
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:release
      - name: Verify packaged Mac app
        if: runner.os == 'macOS'
        run: node scripts/verify-macos-app.mjs
      - name: Verify Mac Linux desktop and persistence
        if: runner.os == 'macOS' && inputs.vm_smoke
        run: node --import tsx scripts/verify-macos-vm.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AelionBot-${{ matrix.name }}
          path: |
            release/github/*.exe
            release/github/*.blockmap
            release/github/*.dmg
            release/github/*.zip
            release/github/latest*.yml
            release/github/*-verification.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && runner.os == 'macOS'
        with:
          name: Mac-checks-${{ matrix.arch }}
          path: |
            output/mac-*.json
            output/mac-*.png
          if-no-files-found: ignore
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: AelionBot-*
          path: release/downloaded
          merge-multiple: true
      - name: Verify complete release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AELION_RELEASE_PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: node scripts/publish-release.mjs release/downloaded
