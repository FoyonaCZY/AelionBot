# Requires a certificate covering both names at the paths below.
# Serve a validated build through /var/www/aelion.chat/current.
server {
    listen 80;
    listen [::]:80;
    server_name aelion.chat www.aelion.chat;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://aelion.chat$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.aelion.chat;

    ssl_certificate /etc/letsencrypt/live/aelion.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aelion.chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://aelion.chat$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aelion.chat;
    root /var/www/aelion.chat/current;
    index index.html;
    server_tokens off;
    error_page 404 /404.html;

    ssl_certificate /etc/letsencrypt/live/aelion.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aelion.chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    location = /404.html {
        internal;
        expires -1;
    }

    location ~ /\. {
        deny all;
    }
}
