<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" fill="none" role="img"><title>放心專注眼前。</title><desc>功能示意，使用示例内容，并非应用截图。</desc><g font-family="Inter, Segoe UI, Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="26" y="26" width="1148" height="688" rx="22" fill="#f6f5f8" stroke="none"/><text x="75" y="108" fill="#2e2b36" font-size="43" font-weight="550">放心專注眼前。</text><text x="76" y="151" fill="#807888" font-size="24" font-weight="400">合作裡的細節，讓夥伴記著。</text><rect x="72" y="194" width="510" height="262" rx="22" fill="#fff" stroke="none"/><text x="105" y="237" fill="#9586a4" font-size="17" font-weight="500">你的偏好</text><text x="105" y="291" fill="#34313d" font-size="29" font-weight="500">寫作風格</text><text x="105" y="338" fill="#7e7786" font-size="23" font-weight="400">清楚、親切、直接一點。</text><rect x="105" y="373" width="66" height="5" rx="2" fill="#af9fc4" stroke="none"/><rect x="181" y="373" width="146" height="5" rx="2" fill="#e4deed" stroke="none"/><rect x="607" y="194" width="519" height="262" rx="22" fill="#fff" stroke="none"/><rect x="641" y="230" width="66" height="72" rx="14" fill="#edf3ef" stroke="none"/><text x="662" y="279" fill="#709380" font-size="31" font-weight="500">F</text><text x="728" y="259" fill="#34313d" font-size="25" font-weight="500">每週資料整理</text><text x="728" y="296" fill="#807888" font-size="21" font-weight="400">星期五 · 上午 9:00</text><path d="M641 328h450" stroke="#e4e4eb"/><text x="644" y="399" fill="#80a090" font-size="19" font-weight="400">下次安排</text><rect x="72" y="481" width="1054" height="163" rx="22" fill="#2e2c36" stroke="none"/><text x="106" y="530" fill="#fff" font-size="27" font-weight="500">每一步，都由你決定。</text><rect x="106" y="556" width="211" height="53" rx="26" fill="#42404a" stroke="none"/><text x="129" y="590" fill="#e8e4ec" font-size="20" font-weight="400">先詢問</text><rect x="336" y="556" width="211" height="53" rx="26" fill="#e7e0f4" stroke="none"/><text x="359" y="590" fill="#4e4266" font-