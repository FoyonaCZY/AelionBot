<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" fill="none" role="img"><title>One brief. Three different strengths.</title><desc>Product illustration with example content; not an application screenshot.</desc><g font-family="Inter, Segoe UI, Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="26" y="26" width="1148" height="688" rx="22" fill="#fff" stroke="#e2e2e9"/><g transform="translate(54 49) scale(0.65625)"><path d="M33 2C51 1 61 14 62 33C63 52 50 62 30 62C11 62 2 51 2 31C2 13 14 2 33 2Z" fill="#9174df"/><ellipse cx="24" cy="29" rx="3" ry="6" fill="white" transform="rotate(-15 24 29)"/><ellipse cx="41" cy="27" rx="3" ry="6" fill="white" transform="rotate(-15 41 27)"/></g><text x="109" y="78" fill="#292833" font-size="24" font-weight="550">Launch team</text><text text-anchor="end" x="1140" y="77" fill="#757580" font-size="15" font-weight="400">3 partners</text><path d="M26 108h1148" stroke="#e4e4eb"/><text x="64" y="167" fill="#272631" font-size="29" font-weight="550">One brief. Three different strengths.</text><g transform="translate(64 208) scale(0.65625)"><path d="M33 2C51 1 61 14 62 33C63 52 50 62 30 62C11 62 2 51 2 31C2 13 14 2 33 2Z" fill="#659ccd"/><ellipse cx="24" cy="29" rx="3" ry="6" fill="white" transform="rotate(-15 24 29)"/><ellipse cx="41" cy="27" rx="3" ry="6" fill="white" transform="rotate(-15 41 27)"/></g><text x="124" y="231" fill="#73727c" font-size="19" font-weight="500">Research partner</text><rect x="122" y="247" width="921" height="62" rx="16" fill="#f5f5f7" stroke="none"/><text x="145" y="286" fill="#282832" font-size="23" font-weight="400">The audience notes and sources are organized.</text><g transform="translate(64 327) scale(0.65625)"><path d="M33 2C51 1 61 14 62 33C63 52 50 62 30 62C11 62 2 51 2 31C2 13 14 2 33 2Z" fill="#ad85b4"/><ellipse cx="24" cy="29" rx="3" ry="6" fill="white" transform="rotate(-15 24 29)"/><ellipse cx="41" cy="27" rx="3" ry="6" fill="white" transform="rotate(-15 41 27)"/></g><text x="124" y="350" fill="#73727c" font-size="19" font-weight="500">Creative partner</text><rect x="122" y="366" width="921" height="62" rx="16" fill="#f5f5f7" stroke="none"/><text x="145" y="405" fill="#282832" font-size="23" font-weight="400">Let’s build the story around a day in their life.</text><g transform="translate(64 446) scale(0.65625)"><path d="M33 2C51 1 61 14 62 33C63 52 50 62 30 62C11 62 2 51 2 31C2 13 14 2 33 2Z" fill="#7dab99"/><ellipse cx="24" cy="29" rx="3" ry="6" fill="white" transform="rotate(-15 24 29)"/><ellipse cx="41" cy="27" rx="3" ry="6" fill="white" transform="rotate(-15 41 27)"/></g><text x="124" y="469" fill="#73727c" font-size="19" font-weight="500">Writing partner</text><rect x="122" y="485" width="921" height="62" rx="16" fill="#f5f5f7" stroke="none"/><text x="145" y="524" fill="#282832" font-size="23" font-weight="400">I’ve brought both into a first draft.</text><rect x="122" y="570" width="530" height="82" rx="14" fill="#eef4f1" stroke="none"/><g transform="translate(144 592)" stroke="#787181" fill="none" stroke-width="2"><path d="M2 0h17l9 9v29H2zM19 0v9h9M8 20h14M8 27h10"/></g><text x="192" y="604" fill="#30303a" font-size="21" font-weight="500">launch-brief.pdf</text><text x="192" y="629" fill="#757580" font-size="15" font-weight="400">Shared with the team</text><text x="750" y="620" fill="#7d7786" font-size="19" font-weight="400">Research → Shape the story</text></g></svg>
