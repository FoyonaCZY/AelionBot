<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" fill="none" role="img"><title>第一版讲稿，准备好了。</title><desc>功能示意，使用示例内容，并非应用截图。</desc><g font-family="Inter, Segoe UI, Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="26" y="26" width="1148" height="688" rx="22" fill="#fff" stroke="#e2e2e9"/><g transform="translate(54 49) scale(0.65625)"><path d="M33 2C51 1 61 14 62 33C63 52 50 62 30 62C11 62 2 51 2 31C2 13 14 2 33 2Z" fill="#9174df"/><ellipse cx="24" cy="29" rx="3" ry="6" fill="white" transform="rotate(-15 24 29)"/><ellipse cx="41" cy="27" rx="3" ry="6" fill="white" transform="rotate(-15 41 27)"/></g><text x="109" y="78" fill="#292833" font-size="24" font-weight="550">写作伙伴</text><text text-anchor="end" x="1140" y="77" fill="#757580" font-size="15" font-weight="400">已完成</text><path d="M26 108h1148" stroke="#e4e4eb"/><rect x="539" y="142" width="585" height="64" rx="20" fill="#eeebf6" stroke="none"/><text x="562" y="182" fill="#282832" font-size="24" font-weight="400">把这些笔记，变成一场十分钟的分享。</text><g transform="translate(64 247) scale(0.65625)"><path d="M33 2C51 1 61 14 62 33C63 52 50 62 30 62C11 62 2 51 2 31C2 13 14 2 33 2Z" fill="#9e83ca"/><ellipse cx="24" cy="29" rx="3" ry="6" fill="white" transform="rotate(-15 24 29)"/><ellipse cx="41" cy="27" rx="3" ry="6" fill="white" transform="rotate(-15 41 27)"/></g><text x="122" y="275" fill="#24232c" font-size="28" font-weight="550">第一版讲稿，准备好了。</text><text x="122" y="315" fill="#73727e" font-size="23" font-weight="400">从开场到结尾，让重点自然讲出来。</text><text x="124" y="365" fill="#9b8bb0" font-size="17" font-weight="500">01</text><text x="174" y="365" fill="#282832" font-size="23" font-weight="400">从最值得分享的想法说起。</text><text x="124" y="410" fill="#9b8bb0" font-size="17" font-weight="500">02</text><text x="174" y="410" fill="#282832" font-size="23" font-weight="400">用一个具体例子，把它讲明白。</text><text x="124" y="455" fill="#9b8bb0" font-size="17" font-weight="500">03</text><text x="174" y="455" fill="#282832" font-size="23" font-weight="400">留给听众一件可以试试的小事。</text><rect x="122" y="484" width="480" height="82" rx="14" fill="#f3f1f8" stroke="none"/><g transform="translate(144 506)" stroke="#787181" fill="none" stroke-width="2"><path d="M2 0h17l9 9v29H2zM19 0v9h9M8 20h14M8 27h10"/></g><text x="192" y="518" fill="#30303a" font-size="21" font-weight="500">分享讲稿.docx</text><text x="192" y="543" fill="#757580" font-size="15" font-weight="400">文档 · 可以保存</text><rect x="614" y="586" width="510" height="52" rx="18" fill="#eeebf6" stroke="none"/><text x="638" y="620" fill="#282832" font-size="21" font-weight="400">开场再亲切一点，像和朋友聊天。</text><path d="M56 659h1088" stroke="#e4e4eb"/><text x="65" y="692" fill="#92929c" font-size="19" font-weight="400">给伙伴发消息…</text><text x="1106" y="692" fill="#282832" font-size="27" font-weight="400">↑</text></g></svg>
